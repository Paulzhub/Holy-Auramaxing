name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Level reference replay (data/build_levels.py, D-063)
        run: python3 -I -c "import sys; sys.path.insert(0, 'data'); import build_levels; build_levels.self_test()"
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Start Supabase (Auth, database, Storage, Realtime, Mailpit)
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,postgres-meta
      - name: Point the app at local Supabase
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            # A throwaway key for this CI run only (encrypts "my why" in tests).
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            # Phase 2d: passkeys on; the app's own emails go to Mailpit.
            echo "PASSKEYS_ENABLED=true"
            echo "EMAIL_PROVIDER=mailpit"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            # Phase 7c: a throwaway VAPID key pair for this run (Web Push).
            node -e 'const k=require("web-push").generateVAPIDKeys();console.log("NEXT_PUBLIC_VAPID_PUBLIC_KEY="+k.publicKey);console.log("VAPID_PRIVATE_KEY="+k.privateKey)'
            echo "VAPID_SUBJECT=mailto:ci@example.test"
            # Phase 10: a throwaway key for sealed offline notes (D-123).
            echo "OFFLINE_NOTE_PRIVATE_KEY=$(node scripts/offline-note-key.mjs)"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - name: Playwright
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse (95+ in every category)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Start Supabase (Auth, database, Mailpit)
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,storage-api,postgres-meta
      - name: Point the app at local Supabase
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3200"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
            # A throwaway key for this CI run only (encrypts "my why" in tests).
            echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            # Phase 2d: passkeys on; the app's own emails go to Mailpit.
            echo "PASSKEYS_ENABLED=true"
            echo "EMAIL_PROVIDER=mailpit"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            # Phase 7c: a throwaway VAPID key pair for this run (Web Push).
            node -e 'const k=require("web-push").generateVAPIDKeys();console.log("NEXT_PUBLIC_VAPID_PUBLIC_KEY="+k.publicKey);console.log("VAPID_PRIVATE_KEY="+k.privateKey)'
            echo "VAPID_SUBJECT=mailto:ci@example.test"
            # Phase 10: a throwaway key for sealed offline notes (D-123).
            echo "OFFLINE_NOTE_PRIVATE_KEY=$(node scripts/offline-note-key.mjs)"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - name: Lighthouse CI
        shell: bash
        # Job logs aren't always reachable, so on a failure the last lines
        # (which page and which score) are also shown as annotations.
        run: |
          set -o pipefail
          npm run lighthouse 2>&1 | tee lighthouse.log || {
            # One annotation (GitHub shows at most ten per step), newlines as %0A.
            summary=$(sed "s/\x1b\[[0-9;]*m//g" lighthouse.log | sed -n '/Checking assertions/,$p' | grep -E "localhost|failure|found:" | tail -80 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Lighthouse::${summary}"
            # The metrics behind each score under 0.95 (from the saved reports).
            node -e '
              const fs = require("fs"), path = require("path");
              const walk = (d) => fs.existsSync(d) ? fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]) : [];
              const lines = [];
              for (const f of walk(".lighthouseci").filter((f) => /lhr-.*\.json$/.test(f))) {
                const r = JSON.parse(fs.readFileSync(f, "utf8"));
                const score = r.categories.performance.score;
                if (score >= 0.95) continue;
                const m = (id) => `${id}=${r.audits[id].displayValue} (${r.audits[id].score})`;
                lines.push(`${r.finalDisplayedUrl} ${score}: ` + ["first-contentful-paint", "largest-contentful-paint", "total-blocking-time", "cumulative-layout-shift", "speed-index"].map(m).join(", "));
              }
              console.log("::error title=Lighthouse metrics::" + (lines.join("%0A") || "no saved reports"));
            ' 
            exit 1
          }
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  database:
    name: Database migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Start Postgres and apply migrations
        run: supabase db start
      - name: Lint SQL
        shell: bash
        run: |
          set +e
          supabase db lint --local --schema public,util,private --level warning --fail-on warning > db-lint.txt 2>&1
          status=$?
          cat db-lint.txt
          if [ "$status" -ne 0 ]; then
            # Surface the findings as annotations on the pull request.
            head -40 db-lint.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=SQL lint::${line}"
            done
          fi
          exit "$status"
      - name: pgTAP
        run: supabase test db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated database types are up to date
        shell: bash
        run: |
          npm run db:types
          npx prettier --write src/lib/supabase/database.types.ts
          git diff --exit-code src/lib/supabase/database.types.ts || {
            echo "::error title=Database types::src/lib/supabase/database.types.ts is out of date. Run npm run db:types and commit it."
            exit 1
          }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
