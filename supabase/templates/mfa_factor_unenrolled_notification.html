<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two-step sign-in is off</title>
  </head>
  <!-- Discreet by design: nothing here says what the app is for (CLAUDE.md §7.8). -->
  <body
    style="margin: 0; padding: 24px; background: #f5f3fa; font-family: Arial, Helvetica, sans-serif; color: #1e1b3a"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px"
    >
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 8px; font-size: 14px; color: #5b5878">Aura</p>
          <h1 style="margin: 0 0 16px; font-size: 22px">Two-step sign-in is off</h1>
          <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
            The authenticator app was just removed from this account, so signing in no longer asks for a code.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .SiteURL }}/settings/security"
              style="
                display: inline-block;
                padding: 12px 20px;
                background: #4a3fb5;
                color: #ffffff;
                text-decoration: none;
                border-radius: 8px;
                font-size: 16px;
              "
              >Turn it back on</a
            >
          </p>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5b5878">
            If you didn't do this, reset your password now and then check your devices under Settings, Security.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
